spring.application.name=notification-service

# Same web/worker split convention as every other service in this system —
# OrderNotificationConsumer and PaymentNotificationConsumer are both gated
# by this. Unlike shipment-service, this service has no producer/outbox
# role to also gate (see notification.service's package-info).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

# Own dedicated database — same "single-purpose database, no schema
# qualifier" convention as every other service in this system.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:notification_service}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Kafka — consumer only in Phase 1 (see notification.service's
# package-info) — no producer.* block needed beyond what
# DeadLetterPublishingRecoverer requires (KafkaConfig.kafkaErrorHandler).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:oms-notification-service}
spring.kafka.consumer.auto-offset-reset=earliest

# Second consumer group on the same oms.order.events topic — PaymentNotificationConsumer.
# Same reasoning as oms-main's own app.kafka.consumer.order-service-group-id
# (see OrderSagaEventConsumer's Javadoc): a listener sharing the default
# group-id above would compete for partitions with OrderNotificationConsumer
# instead of getting its own full copy of the topic, so PaymentConfirmed/
# PaymentFailed events could silently never reach it. A distinct group-id
# per logical consumer, not per class, is what makes one shared topic serve
# multiple independent subscribers correctly.
app.kafka.consumer.payment-group-id=${KAFKA_PAYMENT_CONSUMER_GROUP:oms-notification-service-payment}

# Third consumer group, on the separate oms.customer.events topic —
# CustomerWelcomeConsumer. This one's on a different topic than
# order-events entirely, so unlike payment-group-id there's no partition-
# contention risk with anything else this service reads today — given its
# own group anyway, both for consistency with the "one group per logical
# consumer" convention above and so a second future consumer on this same
# topic (e.g. reacting to CustomerUpdated) doesn't have to retrofit one.
app.kafka.consumer.customer-group-id=${KAFKA_CUSTOMER_CONSUMER_GROUP:oms-notification-service-customer}

# Fourth consumer group, on the separate oms.shipment.events topic —
# ShipmentNotificationConsumer. Same reasoning as customer-group-id above:
# its own topic entirely, so no partition-contention risk with anything
# else here, but given its own group anyway for consistency and so a
# future second consumer on this topic doesn't have to retrofit one.
app.kafka.consumer.shipment-group-id=${KAFKA_SHIPMENT_CONSUMER_GROUP:oms-notification-service-shipment}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

app.kafka.topics.order-events=oms.order.events
app.kafka.topics.customer-events=oms.customer.events
app.kafka.topics.shipment-events=oms.shipment.events

# SmtpEmailProvider — Phase 1's one channel. Local dev points at Mailpit
# (see docker-compose.snippet.yml); a real deployment overrides these with a
# real SMTP relay or provider's SMTP endpoint.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

app.notification.email.from-address=${NOTIFICATION_FROM_ADDRESS:orders@example.com}

# TwilioSmsProvider — Phase 4's SMS channel. No safe defaults for the
# credentials (see TwilioConfig's own Javadoc) — every unconfigured
# deployment must set these explicitly, same as app.customerclient.service-api-key
# below. from-number must be a number/messaging-service SID provisioned in
# the Twilio account these credentials belong to.
app.notification.sms.account-sid=${TWILIO_ACCOUNT_SID}
app.notification.sms.auth-token=${TWILIO_AUTH_TOKEN}
app.notification.sms.from-number=${TWILIO_FROM_NUMBER}

# NotificationRetryScheduler — the plan's §6 notification-level retry/DLQ,
# distinct from Kafka's own retry/DLT (see that class's own Javadoc).
# Values mirror app.kafka.outbox's own poll-interval-ms/batch-size
# conventions (see customer-service/oms-main). max-attempts is new to this
# service — 5 was picked as a starting point (roughly: a few minutes of
# retries at the default poll interval before giving up and requiring a
# human), not derived from any measured SLA — revisit once real failure
# data exists. Env-overridable, same as every other tunable in this file,
# so k8s/00-configmap.yaml can adjust these per environment without a
# rebuild.
app.notification.retry.poll-interval-ms=${NOTIFICATION_RETRY_POLL_INTERVAL_MS:60000}
app.notification.retry.batch-size=${NOTIFICATION_RETRY_BATCH_SIZE:50}
app.notification.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS:5}

# Unsubscribe link token — HMAC-signed (HS256), minted and verified
# entirely within this service (see security.UnsubscribeTokenService), not
# oms-main's JWKS-based tokens. No safe default for the secret, same
# reasoning as app.customerclient.service-api-key below — a default here
# would mean every unconfigured deployment silently shares the same
# signing key. Expiration default (30 days) is generous on purpose: an
# unsubscribe link should still work whenever someone actually reads the
# email, not just in the first few hours. link-base-url is this service's
# own externally-reachable origin — see UnsubscribeTokenProperties' own
# Javadoc for why it can't be inferred from the request.
app.unsubscribe-token.secret=${UNSUBSCRIBE_TOKEN_SECRET}
app.unsubscribe-token.expiration-ms=${UNSUBSCRIBE_TOKEN_EXPIRATION_MS:2592000000}
app.unsubscribe-token.link-base-url=${NOTIFICATION_SERVICE_PUBLIC_BASE_URL:http://localhost:8085}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# CustomerClient — calls out to customer-service.
app.customerclient.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8083/api/v1}
app.customerclient.connect-timeout-ms=${CUSTOMER_CLIENT_CONNECT_TIMEOUT_MS:300}
app.customerclient.read-timeout-ms=${CUSTOMER_CLIENT_READ_TIMEOUT_MS:800}
# See customerclient.config.InternalServiceAuthInterceptor's Javadoc — this
# is a placeholder shared-secret mechanism, not the production-grade answer.
app.customerclient.service-api-key=${INTERNAL_SERVICE_API_KEY}

# OrderClient — calls back into oms-main's order endpoint, purely to
# resolve customerId (see messaging.event.OrderConfirmedEvent's Javadoc for
# why this hop exists at all).
app.orderclient.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8080/api/v1}
app.orderclient.connect-timeout-ms=${ORDER_CLIENT_CONNECT_TIMEOUT_MS:300}
app.orderclient.read-timeout-ms=${ORDER_CLIENT_READ_TIMEOUT_MS:800}
app.orderclient.service-api-key=${INTERNAL_SERVICE_API_KEY}

# Resilience posture for both clients — mirrors shipment-service's own
# orderClient instance exactly, INCLUDING minimum-number-of-calls (see that
# service's own history for why this line is not optional — resilience4j
# defaults it to 100 independent of sliding-window-size, silently defeating
# a small window if omitted).
resilience4j.retry.instances.customerClient.max-attempts=2
resilience4j.retry.instances.customerClient.wait-duration=200ms
resilience4j.retry.instances.customerClient.retry-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.customerClient.ignore-exceptions=com.giri.oms.customerclient.exception.CustomerNotFoundException

resilience4j.circuitbreaker.instances.customerClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.customerClient.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.customerClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.customerClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.customerClient.record-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.instances.customerClient.ignore-exceptions=com.giri.oms.customerclient.exception.CustomerNotFoundException

resilience4j.retry.instances.orderClient.max-attempts=2
resilience4j.retry.instances.orderClient.wait-duration=200ms
resilience4j.retry.instances.orderClient.retry-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.orderClient.ignore-exceptions=com.giri.oms.orderclient.exception.OrderNotFoundException

resilience4j.circuitbreaker.instances.orderClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderClient.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.orderClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderClient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.orderClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.orderClient.record-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.instances.orderClient.ignore-exceptions=com.giri.oms.orderclient.exception.OrderNotFoundException

# twilioSmsProvider — see TwilioSmsProvider's own Javadoc for why this
# doesn't need an ignore-exceptions line the way customerClient/orderClient
# above do: permanent (4xx, non-429) Twilio failures are returned as an
# ordinary value from doSend, never thrown, so they never reach Retry to
# begin with. minimum-number-of-calls set explicitly for the same reason
# flagged on every other resilience4j instance in this file — omitting it
# silently defaults to 100, defeating a 10-window before the breaker can
# ever trip.
resilience4j.retry.instances.twilioSmsProvider.max-attempts=2
resilience4j.retry.instances.twilioSmsProvider.wait-duration=200ms
resilience4j.retry.instances.twilioSmsProvider.retry-exceptions=com.twilio.exception.ApiException,com.twilio.exception.ApiConnectionException

resilience4j.circuitbreaker.instances.twilioSmsProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.twilioSmsProvider.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.twilioSmsProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.twilioSmsProvider.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.twilioSmsProvider.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.twilioSmsProvider.record-exceptions=com.twilio.exception.ApiException,com.twilio.exception.ApiConnectionException

# JWT *verification* only — points at oms-main's existing JWKS endpoint.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVICE_JWKS_URI:http://localhost:8080/.well-known/jwks.json}

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.one-indexed-parameters=false

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %-5level %logger{36} - %msg%n
logging.level.org.apache.kafka.clients=WARN
logging.level.org.apache.kafka.clients.consumer.internals.AbstractCoordinator=INFO

management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}

springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.path=/docs

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true
management.server.port=${MANAGEMENT_SERVER_PORT:8081}

management.metrics.tags.application=${spring.application.name}
management.metrics.tags.role=${APP_PROCESS_ROLE:unset}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

info.app.version=${APP_VERSION:unknown}
info.app.git-sha=${APP_GIT_SHA:unknown}
