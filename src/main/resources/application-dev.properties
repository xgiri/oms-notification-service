# ---------------------------------------------------------------------------
# dev profile — local development (docker-compose up, or an IDE run config).
# No JWT keys here — this service only verifies tokens via jwk-set-uri, it
# never signs one.
# ---------------------------------------------------------------------------

logging.level.root=INFO
logging.level.com.giri.oms=DEBUG
logging.level.org.hibernate.SQL=DEBUG

management.info.env.enabled=true

spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

app.customerclient.service-api-key=${INTERNAL_SERVICE_API_KEY:dev-local-only-key}
app.orderclient.service-api-key=${INTERNAL_SERVICE_API_KEY:dev-local-only-key}

# Dev-only default — Base64 of 32 random bytes. Fine for local dev (see
# UnsubscribeTokenProperties), never for a real deployment.
app.unsubscribe-token.secret=${UNSUBSCRIBE_TOKEN_SECRET:VhRVdbUkFiv6qTsRm/d+6rhLVYkFg0RfBXQPCH1lOXE=}

spring.jpa.show-sql=true
spring.thymeleaf.cache=false
