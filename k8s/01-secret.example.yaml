# Template only — do NOT apply this file as-is or commit real values into
# it. Copy it, fill in real secrets out of band, and apply the copy. Same
# convention as every other service's own 01-secret.example.yaml in this
# system.
#
# No Vault integration here (see 00-configmap.yaml's note), so these are
# genuinely plain secret values, not a placeholder for a Vault-resolved
# path — worth closing before this ever holds production credentials, same
# gap flagged on customer-service's own equivalent file.
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  labels:
    app.kubernetes.io/name: notification-service
type: Opaque
stringData:
  DB_USERNAME: "changeme"
  DB_PASSWORD: "changeme"

  # Every JWT this service verifies (see security.SecurityConfig) is
  # issued by oms-main, but this service's own unsubscribe tokens
  # (security.UnsubscribeTokenService) are signed with this separate
  # HMAC-SHA256 key — no safe default outside the dev profile (see
  # application-dev.properties). Generate with e.g.
  # `openssl rand -base64 32`.
  UNSUBSCRIBE_TOKEN_SECRET: "changeme"

  # Shared across every internal service-to-service call this system
  # makes (CustomerClient, OrderClient) — see
  # InternalServiceAuthInterceptor's own Javadoc for what this currently
  # does and doesn't protect (flagged as a known gap in this repo's
  # README).
  INTERNAL_SERVICE_API_KEY: "changeme"

  # No safe defaults (see TwilioConfig's own Javadoc) — every
  # unconfigured deployment must set these explicitly, same reasoning as
  # INTERNAL_SERVICE_API_KEY above.
  TWILIO_ACCOUNT_SID: "changeme"
  TWILIO_AUTH_TOKEN: "changeme"
  TWILIO_FROM_NUMBER: "changeme"

  # FcmConfig — only read at all if PUSH_NOTIFICATIONS_ENABLED=true in
  # 00-configmap.yaml (see that key's own comment on why it's false by
  # default). Base64 of the FCM service account JSON key file Firebase
  # Console gives you, not the raw JSON itself — same reasoning as
  # threading any multi-line secret through a Kubernetes Secret's
  # stringData cleanly. Generate with e.g.
  # `base64 -i service-account.json | tr -d '\n'`.
  FCM_SERVICE_ACCOUNT_JSON_BASE64: "changeme"

  # Only needed if SMTP_AUTH=true in 00-configmap.yaml (a real relay
  # almost always requires this; Mailpit locally does not).
  SMTP_USERNAME: "changeme"
  SMTP_PASSWORD: "changeme"

  # KEDA's postgresql scaler (06-scaledobject-worker.yaml) needs its own
  # connection string, separate from spring.datasource.* — same pattern as
  # oms-main's own OUTBOX_PG_CONNECTION. Point it at the same
  # notification-db this Deployment itself uses.
  NOTIFICATION_PG_CONNECTION: "host=notification-db port=5432 dbname=notification_service user=changeme password=changeme sslmode=disable"
