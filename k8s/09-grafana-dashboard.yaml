# Auto-imports the notification-service Overview dashboard into Grafana —
# same mechanism as every other service's own k8s/*-grafana-dashboard.yaml
# in this system (Prometheus Operator + kube-prometheus-stack's Grafana
# dashboard sidecar).
#
# Commented out of kustomization.yaml by default, same reasoning as
# 08-podmonitor.yaml: depends on that external chart being installed
# first.
#
# The "Notifications" row (sent/failed/dead-lettered by channel and type,
# retry-queue depth, provider send-duration percentiles) is backed by
# NotificationMetrics — see that class's own Javadoc for exactly which
# meter names/tags it registers and why. One thing still NOT here: a
# time-to-delivery panel (event received -> notification sent). That
# needs the event's own receipt time threaded through
# NotificationService#processEvent's signature from each
# @KafkaListener's ConsumerRecord#timestamp() — a public-interface change
# touching all 3 consumers and their tests, deliberately left as a
# separate follow-up rather than folded into NotificationMetrics itself.
# Retry-queue depth (notifications_pending_failed) is ALSO visible to
# KEDA directly (06-scaledobject-worker.yaml's own postgresql trigger
# queries the same FAILED count independently) — same number, two
# different consumers, same reasoning as OutboxMetrics' own pending gauge
# in customer-service/oms-main.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-grafana-dashboard
  labels:
    app.kubernetes.io/name: notification-service
    grafana_dashboard: '1'
data:
  notification-service-overview.json: |
    {
