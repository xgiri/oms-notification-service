      "uid": "notification-service-overview",
      "title": "notification-service Overview",
      "description": "notification-service: web/worker split via the `role` tag, HTTP traffic, notification send/failure/dead-letter outcomes by channel and type, retry-queue depth, provider send latency, Kafka consumer lag, JVM, and DB pool. Generated to match the metrics already exposed at /actuator/prometheus \u2014 see application.properties and NotificationMetrics.java. Companion to oms-overview.json/customer-service-overview.json/product-service-overview.json, not a replacement \u2014 filtered by application=\"notification-service\" throughout. Does NOT include a time-to-delivery panel (event received \u2192 notification sent) \u2014 that needs the event's own receipt time threaded through NotificationService#processEvent, a public-interface signature change not made as part of NotificationMetrics; see that class's own Javadoc.",
