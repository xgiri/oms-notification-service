            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(up{job=\"notification-service\", app_kubernetes_io_component=\"web\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
